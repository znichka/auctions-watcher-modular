---
version: "2.4"
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: auctions-cadvisor
    restart: unless-stopped
    ports:
      - ${cadvisor_port}:8080
    # Read-only: no --privileged. On this host (cgroup v2, overlay2) that's enough for
    # per-container memory/CPU stats; only edge-case metrics (per-disk I/O, some
    # machine-level hardware stats) may be missing or log benign permission warnings.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
